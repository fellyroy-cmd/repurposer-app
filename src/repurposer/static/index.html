<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Repurposer</title>
<style>
    /* No framework, no build step -- just enough CSS to make this usable. */
    body {
        font-family: -apple-system, Segoe UI, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1a1a1a;
        background: #fafafa;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; }
    textarea {
        width: 100%;
        min-height: 220px;
        font-size: 1rem;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: inherit;
    }
    button {
        margin-top: 12px;
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        background: #1a1a1a;
        color: white;
        cursor: pointer;
    }
    button:disabled { background: #999; cursor: not-allowed; }
    .status { margin-top: 10px; color: #666; font-size: 0.9rem; }
    .status.error { color: #b00020; }
    .card {
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
    }
    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .card h2 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #444;
    }
    .copy-btn {
        margin: 0;
        padding: 4px 12px;
        font-size: 0.8rem;
        background: white;
        color: #1a1a1a;
        border: 1px solid #ccc;
    }
    .copy-btn.copied {
        background: #1a7a3a;
        color: white;
        border-color: #1a7a3a;
    }
    .card pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: inherit;
        margin: 0;
    }
    .card ol { padding-left: 20px; margin: 0; }
    .card li { margin-bottom: 8px; }
    .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
    }
    .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 999px;
        background: white;
        font-size: 0.9rem;
        cursor: pointer;
    }
    .toggle input { cursor: pointer; }
</style>
</head>
<body>

<h1>Repurposer</h1>
<p class="sub">Paste a script. Get it rewritten for every platform in your brand voice.</p>

<textarea id="script" placeholder="Paste your YouTube script here..."></textarea>

<div id="toggles" class="toggles"></div>

<button id="go">Repurpose</button>
<div id="status" class="status"></div>

<div id="results"></div>

<script>
const PLATFORM_LABELS = {
    x: "X (Twitter)",
    linkedin: "LinkedIn",
    instagram: "Instagram",
    tiktok: "TikTok",
    newsletter: "Newsletter",
};

const goBtn = document.getElementById("go");
const scriptBox = document.getElementById("script");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const togglesEl = document.getElementById("toggles");

// One checkbox per platform, all checked by default -- "generate everything"
// is still the default experience, toggles just let you narrow it down.
function buildToggles() {
    for (const platform of Object.keys(PLATFORM_LABELS)) {
        const label = document.createElement("label");
        label.className = "toggle";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = platform;
        checkbox.checked = true;
        checkbox.className = "platform-toggle";

        const text = document.createElement("span");
        text.textContent = PLATFORM_LABELS[platform];

        label.appendChild(checkbox);
        label.appendChild(text);
        togglesEl.appendChild(label);
    }
}

function selectedPlatforms() {
    const checked = togglesEl.querySelectorAll(".platform-toggle:checked");
    return Array.from(checked).map((box) => box.value);
}

buildToggles();

function plainTextFor(result) {
    // What actually lands on the clipboard. Plain-text platforms are
    // already copyable as-is; the IG carousel is structured data, so it
    // gets flattened into something a human would paste into a real post:
    // caption first, then each slide numbered underneath.
    if (result.carousel) {
        const slides = result.carousel.slides
            .map((slide, i) => (i + 1) + ". " + slide)
            .join("\n");
        return result.carousel.caption + "\n\n" + slides;
    }
    return result.content;
}

function renderCard(result) {
    const card = document.createElement("div");
    card.className = "card";

    const header = document.createElement("div");
    header.className = "card-header";

    const label = PLATFORM_LABELS[result.platform] || result.platform;
    const heading = document.createElement("h2");
    heading.textContent = label;
    header.appendChild(heading);

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "Copy";
    copyBtn.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(plainTextFor(result));
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add("copied");
        } catch (err) {
            copyBtn.textContent = "Copy failed";
        } finally {
            setTimeout(() => {
                copyBtn.textContent = "Copy";
                copyBtn.classList.remove("copied");
            }, 1500);
        }
    });
    header.appendChild(copyBtn);

    card.appendChild(header);

    if (result.carousel) {
        // Instagram comes back structured: a caption plus a numbered list of slides.
        const caption = document.createElement("p");
        caption.textContent = "Caption: " + result.carousel.caption;
        card.appendChild(caption);

        const list = document.createElement("ol");
        for (const slide of result.carousel.slides) {
            const item = document.createElement("li");
            item.textContent = slide;
            list.appendChild(item);
        }
        card.appendChild(list);
    } else {
        // Every other platform is plain text -- just show it as-is, copyable.
        const pre = document.createElement("pre");
        pre.textContent = result.content;
        card.appendChild(pre);
    }

    return card;
}

async function repurposeAll() {
    const script = scriptBox.value.trim();
    if (!script) {
        statusEl.textContent = "Paste a script first.";
        statusEl.className = "status error";
        return;
    }

    const platforms = selectedPlatforms();
    if (platforms.length === 0) {
        statusEl.textContent = "Pick at least one platform.";
        statusEl.className = "status error";
        return;
    }

    goBtn.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "Calling Claude for " + platforms.length + " platform" + (platforms.length === 1 ? "" : "s") + "... this can take a few seconds.";
    resultsEl.innerHTML = "";

    try {
        const response = await fetch("/repurpose-all", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ script, platforms }),
        });

        const data = await response.json();

        if (!response.ok) {
            // FastAPI error responses put the message in `detail`.
            throw new Error(data.detail || "Something went wrong.");
        }

        statusEl.textContent = "Done -- " + data.results.length + " platforms ready to copy.";
        for (const result of data.results) {
            resultsEl.appendChild(renderCard(result));
        }
    } catch (err) {
        statusEl.className = "status error";
        statusEl.textContent = err.message;
    } finally {
        goBtn.disabled = false;
    }
}

goBtn.addEventListener("click", repurposeAll);
</script>

</body>
</html>
